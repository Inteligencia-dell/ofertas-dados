name: Piloto Desktop v3 - Lote 1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: piloto-desktop-lote-1-v3
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validar coletor
        run: |
          test -f scripts/coletar_desktop_lote_1_v3.py
          python -m py_compile scripts/coletar_desktop_lote_1_v3.py
      - name: Executar lote 1
        run: python scripts/coletar_desktop_lote_1_v3.py
      - name: Resumo
        if: always()
        run: |
          if [ -f dados/piloto-desktop-lote-1-v3.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open('dados/piloto-desktop-lote-1-v3.json', encoding='utf-8'))
          s = d.get('summary', {})
          print('### Desktop v3 - Lote 1')
          print('')
          print('| Indicador | Valor |')
          print('|---|---:|')
          print('| Cidades esperadas | 20 |')
          print('| Cidades processadas | %s |' % s.get('citiesProcessed', 0))
          print('| Localizacoes confirmadas | %s |' % s.get('locationsConfirmed', 0))
          print('| Cidades com Fibra | %s |' % s.get('citiesWithFiber', 0))
          print('| Cidades com Fibra + Movel | %s |' % s.get('citiesWithFiberMobile', 0))
          print('| Ofertas com TV aceitas | %s |' % s.get('tvOffersAccepted', 0))
          print('| Pendencias territoriais | %s |' % s.get('territorialPending', 0))
          print('')
          for r in d.get('results', []):
              print('#### %s/SP' % r.get('city'))
              for o in r.get('fiberOffers', []):
                  extra = ' + Desktop Play de cortesia' if o.get('desktopPlayCourtesy') else ''
                  meses = o.get('promotionMonths')
                  print('- Fibra: %s%s - R$ %.2f%s - apos R$ %s' % (
                      o['name'], extra, o['monthlyPrice'],
                      (' por %s meses' % meses) if meses else '',
                      o.get('postPromotionPrice')))
              for o in r.get('fiberMobileOffers', []):
                  meses = o.get('promotionMonths')
                  print('- Fibra + Movel: %s - R$ %.2f%s - apos R$ %s' % (
                      o['name'], o['monthlyPrice'],
                      (' por %s meses' % meses) if meses else '',
                      o.get('postPromotionPrice')))
              if r.get('reason'):
                  print('- Motivo: %s' % r['reason'])
                  diag = r.get('selectionDiagnostics') or {}
                  opcoes = diag.get('autocompleteOptions') or []
                  if opcoes:
                      print('- Opcoes vistas no autocomplete: %s' % ', '.join(opcoes[:12]))
          PY
          fi
      - name: Publicar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piloto-desktop-lote-1-v3-evidencias
          path: |
            dados/piloto-desktop-lote-1-v3.json
            evidencias-desktop-lote-1-v3/
          if-no-files-found: warn
          retention-days: 7
