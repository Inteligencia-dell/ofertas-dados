name: Coleta recorrente Vivo - portfolio publico - 97 cidades

on:
  workflow_dispatch:
  schedule:
    - cron: '20 9 * * 1'

permissions:
  contents: write

concurrency:
  group: coleta-recorrente-vivo-portfolio-publico-97-cidades
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Playwright e Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Validar coletor
        run: |
          test -f scripts/coletar_vivo_portfolio_publico_97_cidades.py
          python -m py_compile scripts/coletar_vivo_portfolio_publico_97_cidades.py

      - name: Coletar portfolio publico Vivo
        run: python scripts/coletar_vivo_portfolio_publico_97_cidades.py

      - name: Resumo
        if: always()
        run: |
          if [ -f dados/vivo-portfolio-publico-97-cidades.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('dados/vivo-portfolio-publico-97-cidades.json',encoding='utf-8'))
          print('### Vivo - portfolio publico - 97 cidades de referencia')
          print('')
          print('| Indicador | Valor |')
          print('|---|---:|')
          print('| HTTP | %s |' % d.get('httpStatus',d.get('collectionFailureHttpStatus')))
          print('| Cidades de referencia | %s |' % len(d.get('cities',[])))
          print('| Ofertas Fibra | %s |' % len(d.get('fiberOffers',[])))
          print('| Ofertas Fibra + Movel | %s |' % len(d.get('fiberMobileOffers',[])))
          print('| Ofertas com TV aceitas | %s |' % d.get('tvOffersAccepted',0))
          print('| Localizacao municipal confirmada | %s |' % d.get('locationConfirmed',False))
          print('| Ultimo valido preservado | %s |' % d.get('usedLastValid',False))
          print('| Portfolio alterado | %s |' % d.get('portfolioChanged',False))
          print('| Status | %s |' % d.get('status'))
          print('')
          print('> Oferta publica de referencia. Disponibilidade, preco e viabilidade tecnica nao confirmados por municipio.')
          PY
          else
            echo 'Resultado nao gerado.' >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash

      - name: Publicar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vivo-portfolio-publico-97-cidades-evidencias
          path: |
            dados/vivo-portfolio-publico-97-cidades.json
            dados/vivo-portfolio-publico-97-cidades-ultimo-valido.json
            evidencias-vivo-portfolio-publico-97-cidades/
          if-no-files-found: warn
          retention-days: 14

      - name: Persistir somente dados Vivo
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- dados/vivo-portfolio-publico-97-cidades.json dados/vivo-portfolio-publico-97-cidades-ultimo-valido.json
          if git diff --cached --quiet; then
            echo "Sem alteracoes de portfolio Vivo."
          else
            git commit -m "Atualizar portfolio publico Vivo"
            git push
          fi
