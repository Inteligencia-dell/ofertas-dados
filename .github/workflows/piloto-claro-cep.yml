name: Piloto Claro por CEP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: piloto-claro-cep
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Playwright e Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Validar arquivos do piloto
        run: |
          test -f scripts/coletar_claro_cep_piloto.py
          test -f fontes.json
          python -m py_compile scripts/coletar_claro_cep_piloto.py

      - name: Executar cinco cidades piloto
        run: python scripts/coletar_claro_cep_piloto.py

      - name: Resumo do piloto
        if: always()
        run: |
          if [ -f dados/piloto-claro-cep.json ]; then
            python - <<'PY'
          import json
          d=json.load(open('dados/piloto-claro-cep.json',encoding='utf-8'))
          s=d.get('summary',{})
          print('### Piloto Claro por CEP')
          print('')
          print('| Indicador | Valor |')
          print('|---|---:|')
          print('| Cidades testadas | %s |' % d.get('meta',{}).get('cities',0))
          print('| Localizacao confirmada | %s |' % s.get('locationConfirmed',0))
          print('| Com ofertas extraidas | %s |' % s.get('withOffers',0))
          print('| Pendentes | %s |' % s.get('pending',0))
          print('')
          for r in d.get('results',[]):
              print('- **%s/%s** - CEP `%s` - confirmado `%s` - ofertas `%s` - %s' % (
                  r.get('c'),r.get('uf'),r.get('cepConsultado'),r.get('locationConfirmed'),
                  len(r.get('offersFound',[])),r.get('reason',r.get('status'))))
          PY
          else
            echo '### Piloto Claro por CEP' >> "$GITHUB_STEP_SUMMARY"
            echo 'Arquivo de resultado nao foi gerado.' >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash

      - name: Publicar evidencias como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piloto-claro-cep-evidencias
          path: |
            dados/piloto-claro-cep.json
            evidencias-claro-cep/
          if-no-files-found: warn
          retention-days: 7
