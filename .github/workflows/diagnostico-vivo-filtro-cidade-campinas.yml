name: Diagnostico Vivo - filtro publico de cidade - Campinas

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostico-vivo-filtro-cidade-campinas
  cancel-in-progress: false

jobs:
  diagnosticar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Playwright e Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Validar diagnostico
        run: |
          test -f scripts/diagnosticar_vivo_filtro_cidade_campinas.py
          python -m py_compile scripts/diagnosticar_vivo_filtro_cidade_campinas.py

      - name: Selecionar Campinas e testar paginas
        run: python scripts/diagnosticar_vivo_filtro_cidade_campinas.py

      - name: Resumo
        if: always()
        run: |
          if [ -f dados/diagnostico-vivo-filtro-cidade-campinas.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('dados/diagnostico-vivo-filtro-cidade-campinas.json',encoding='utf-8'))
          s=d.get('summary',{})
          print('### Diagnostico Vivo - filtro publico - Campinas')
          print('')
          print('| Indicador | Valor |')
          print('|---|---:|')
          print('| HTTP da home | %s |' % d.get('homeHttpStatus'))
          print('| Campinas confirmada na home | %s |' % s.get('locationConfirmed'))
          print('| Paginas verificadas | %s |' % s.get('pagesChecked',0))
          print('| Paginas mantendo Campinas | %s |' % s.get('pagesKeepingCampinas',0))
          print('| Paginas com Fibra | %s |' % s.get('pagesWithFiber',0))
          print('| Paginas com Fibra + Movel | %s |' % s.get('pagesWithFiberMobile',0))
          print('| Motivo | %s |' % d.get('reason','-'))
          print('')
          for p in d.get('pagesChecked',[]):
              print('#### %s' % p.get('url'))
              print('- HTTP: %s' % p.get('httpStatus'))
              print('- Campinas visivel: %s' % (p.get('campinasVisible') or p.get('locationHeaderVisible')))
              print('- Fibra: %s' % p.get('fiberMentioned'))
              print('- Fibra + Movel: %s' % p.get('vivoTotalMentioned'))
          PY
          else
            echo 'Resultado nao gerado.' >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash

      - name: Publicar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-vivo-filtro-cidade-campinas-evidencias
          path: |
            dados/diagnostico-vivo-filtro-cidade-campinas.json
            evidencias-vivo-filtro-cidade-campinas/
          if-no-files-found: warn
          retention-days: 7
