name: Piloto Claro - Fibra e Fibra mais Movel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: piloto-claro-fibra-convergente-campinas
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Playwright e Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Validar piloto
        run: |
          test -f scripts/coletar_claro_fibra_convergente_campinas_piloto.py
          python -m py_compile scripts/coletar_claro_fibra_convergente_campinas_piloto.py

      - name: Testar Campinas
        run: python scripts/coletar_claro_fibra_convergente_campinas_piloto.py

      - name: Resumo
        if: always()
        run: |
          if [ -f dados/piloto-claro-fibra-convergente-campinas.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('dados/piloto-claro-fibra-convergente-campinas.json',encoding='utf-8'))
          r=d.get('results',[{}])[0]
          print('### Claro Campinas - Fibra e Fibra + Movel')
          print('')
          print('| Indicador | Valor |')
          print('|---|---:|')
          print('| Localizacao confirmada | %s |' % r.get('locationConfirmed',False))
          print('| Ofertas Fibra | %s |' % len(r.get('fiberOffers',[])))
          print('| Ofertas Fibra + Movel | %s |' % len(r.get('convergentOffers',[])))
          print('| Ofertas com TV aceitas | 0 |')
          print('')
          print('#### Fibra')
          for o in r.get('fiberOffers',[]):
              print('- %s - R$ %.2f' % (o.get('name'),o.get('price',0)))
          print('')
          print('#### Fibra + Movel')
          for o in r.get('convergentOffers',[]):
              print('- %s - R$ %.2f - anterior %s' % (
                  o.get('name'),o.get('monthlyPrice',0),o.get('previousPrice')))
          PY
          else
            echo 'Resultado nao gerado.' >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash

      - name: Publicar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piloto-claro-fibra-convergente-campinas-evidencias
          path: |
            dados/piloto-claro-fibra-convergente-campinas.json
            evidencias-claro-fibra-convergente-campinas/
          if-no-files-found: warn
          retention-days: 7
