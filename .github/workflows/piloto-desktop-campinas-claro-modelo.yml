name: Piloto Desktop Campinas - modelo Claro

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: piloto-desktop-campinas-modelo-claro
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Validar coletor
        run: |
          test -f scripts/coletar_desktop_campinas_claro_modelo.py
          python -m py_compile scripts/coletar_desktop_campinas_claro_modelo.py

      - name: Testar Desktop Campinas
        run: python scripts/coletar_desktop_campinas_claro_modelo.py

      - name: Resumo no modelo Claro
        if: always()
        run: |
          if [ -f dados/piloto-desktop-campinas-claro-modelo.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('dados/piloto-desktop-campinas-claro-modelo.json',encoding='utf-8'))
          print('### Desktop Campinas - Fibra e Fibra + Movel')
          print('')
          print('| Indicador | Valor |')
          print('|---|---:|')
          print('| Localizacao confirmada | %s |' % d.get('locationConfirmed',False))
          print('| Ofertas Fibra | %s |' % len(d.get('fiberOffers',[])))
          print('| Ofertas Fibra + Movel | %s |' % len(d.get('fiberMobileOffers',[])))
          print('| Ofertas com TV aceitas | %s |' % d.get('tvOffersAccepted',0))
          print('')
          print('### Fibra')
          for o in d.get('fiberOffers',[]):
              beneficio=' + Desktop Play de cortesia' if o.get('desktopPlayCourtesy') else ''
              print('- %s%s - R$ %.2f' % (o.get('name'),beneficio,o.get('monthlyPrice',0)))
          print('')
          print('### Fibra + Movel')
          for o in d.get('fiberMobileOffers',[]):
              print('- %s - R$ %.2f - anterior %s' % (o.get('name'),o.get('monthlyPrice',0),o.get('previousPrice')))
          print('')
          print('Status: %s' % d.get('status'))
          print('Motivo: %s' % d.get('reason','-'))
          PY
          fi
        shell: bash

      - name: Publicar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piloto-desktop-campinas-modelo-claro-evidencias
          path: |
            dados/piloto-desktop-campinas-claro-modelo.json
            evidencias-desktop-campinas-claro-modelo/
          if-no-files-found: warn
          retention-days: 7
