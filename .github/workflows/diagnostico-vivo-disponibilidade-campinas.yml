name: Diagnostico Vivo - disponibilidade territorial - Campinas

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostico-vivo-disponibilidade-campinas
  cancel-in-progress: false

jobs:
  diagnosticar:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Playwright e Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Validar diagnostico
        run: |
          test -f scripts/diagnosticar_vivo_disponibilidade_campinas.py
          python -m py_compile scripts/diagnosticar_vivo_disponibilidade_campinas.py

      - name: Diagnosticar jornadas Consultar
        run: python scripts/diagnosticar_vivo_disponibilidade_campinas.py

      - name: Resumo
        if: always()
        run: |
          if [ -f dados/diagnostico-vivo-disponibilidade-campinas.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('dados/diagnostico-vivo-disponibilidade-campinas.json',encoding='utf-8'))
          s=d.get('summary',{})
          print('### Diagnostico territorial Vivo - Campinas')
          print('')
          print('| Indicador | Valor |')
          print('|---|---:|')
          print('| Links Consultar encontrados | %s |' % s.get('offersFound',0))
          print('| Jornadas diagnosticadas | %s |' % s.get('offersDiagnosed',0))
          print('| Formularios territoriais encontrados | %s |' % s.get('territorialFormsFound',0))
          print('| Jornadas pedindo dados pessoais | %s |' % s.get('personalDataRequested',0))
          print('| Bloqueios ou CAPTCHA | %s |' % s.get('blockedOrCaptcha',0))
          print('| Metodos territoriais | %s |' % ', '.join(s.get('methods',[])))
          print('')
          for o in d.get('offersChecked',[]):
              print('#### %s' % (o.get('cardId') or 'Oferta %s' % o.get('index')))
              print('- HTTP: %s' % o.get('httpStatus'))
              print('- URL final: %s' % o.get('finalUrl'))
              print('- Metodo: %s' % o.get('method'))
              print('- Formulario territorial: %s' % o.get('territorialFormFound'))
              print('- Dados pessoais solicitados: %s' % o.get('personalDataRequested'))
              print('- Bloqueado/CAPTCHA: %s' % (o.get('blocked') or o.get('captchaDetected')))
          PY
          else
            echo 'Resultado nao gerado.' >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash

      - name: Publicar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-vivo-disponibilidade-campinas-evidencias
          path: |
            dados/diagnostico-vivo-disponibilidade-campinas.json
            evidencias-vivo-disponibilidade-campinas/
          if-no-files-found: warn
          retention-days: 7
