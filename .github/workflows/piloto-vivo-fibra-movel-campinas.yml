name: Piloto Vivo - Fibra e Fibra mais Movel - Campinas

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: piloto-vivo-fibra-movel-campinas
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Playwright e Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Validar piloto
        run: |
          test -f scripts/coletar_vivo_fibra_movel_campinas_piloto.py
          python -m py_compile scripts/coletar_vivo_fibra_movel_campinas_piloto.py

      - name: Testar Vivo em Campinas
        run: python scripts/coletar_vivo_fibra_movel_campinas_piloto.py

      - name: Resumo
        if: always()
        run: |
          if [ -f dados/piloto-vivo-fibra-movel-campinas.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('dados/piloto-vivo-fibra-movel-campinas.json',encoding='utf-8'))
          print('### Vivo Campinas - Fibra e Fibra + Movel')
          print('')
          print('| Indicador | Valor |')
          print('|---|---:|')
          print('| HTTP | %s |' % d.get('httpStatus'))
          print('| Localizacao confirmada | %s |' % d.get('locationConfirmed',False))
          print('| Ofertas Fibra | %s |' % len(d.get('fiberOffers',[])))
          print('| Ofertas Fibra + Movel | %s |' % len(d.get('fiberMobileOffers',[])))
          print('| Ofertas com TV aceitas | %s |' % d.get('tvOffersAccepted',0))
          print('| Status | %s |' % d.get('status'))
          print('| Motivo | %s |' % d.get('reason','-'))
          print('')
          print('#### Fibra')
          for o in d.get('fiberOffers',[]):
              print('- %s - R$ %.2f - anterior %s' % (o.get('name'),o.get('monthlyPrice',0),o.get('previousPrice')))
          print('')
          print('#### Fibra + Movel')
          for o in d.get('fiberMobileOffers',[]):
              print('- %s - R$ %.2f - anterior %s' % (o.get('name'),o.get('monthlyPrice',0),o.get('previousPrice')))
          PY
          else
            echo 'Resultado nao gerado.' >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash

      - name: Publicar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piloto-vivo-fibra-movel-campinas-evidencias
          path: |
            dados/piloto-vivo-fibra-movel-campinas.json
            evidencias-vivo-fibra-movel-campinas/
          if-no-files-found: warn
          retention-days: 7
