name: Piloto Claro - cinco cidades

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: piloto-claro-cidades
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Playwright e Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Validar piloto
        run: |
          test -f scripts/coletar_claro_cidades_piloto.py
          python -m py_compile scripts/coletar_claro_cidades_piloto.py

      - name: Testar cinco cidades
        run: python scripts/coletar_claro_cidades_piloto.py

      - name: Resumo
        if: always()
        run: |
          if [ -f dados/piloto-claro-cidades.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('dados/piloto-claro-cidades.json',encoding='utf-8'))
          s=d.get('summary',{})
          print('### Piloto Claro - cinco cidades')
          print('')
          print('| Indicador | Valor |')
          print('|---|---:|')
          print('| Cidades | %s |' % s.get('cities',0))
          print('| Localizacao confirmada | %s |' % s.get('confirmed',0))
          print('| Com ofertas | %s |' % s.get('withOffers',0))
          print('| Pendentes | %s |' % s.get('pending',0))
          print('')
          for r in d.get('results',[]):
              print('- **%s/%s** - confirmado `%s` - ofertas `%s` - %s' % (
                  r.get('city'),r.get('uf'),r.get('locationConfirmed'),
                  len(r.get('offersFound',[])),r.get('reason',r.get('status'))))
          PY
          else
            echo 'Resultado nao gerado.' >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash

      - name: Publicar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piloto-claro-cinco-cidades-evidencias
          path: |
            dados/piloto-claro-cidades.json
            evidencias-claro-cidades/
          if-no-files-found: warn
          retention-days: 7
