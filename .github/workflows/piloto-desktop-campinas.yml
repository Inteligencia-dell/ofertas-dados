name: Piloto Desktop - Internet e Internet mais Celular - Campinas

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: piloto-desktop-campinas
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Playwright e Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validar piloto
        run: |
          test -f scripts/coletar_desktop_campinas_piloto.py
          python -m py_compile scripts/coletar_desktop_campinas_piloto.py
      - name: Testar Desktop em Campinas
        run: python scripts/coletar_desktop_campinas_piloto.py
      - name: Resumo
        if: always()
        run: |
          if [ -f dados/piloto-desktop-campinas.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('dados/piloto-desktop-campinas.json',encoding='utf-8'))
          print('### Desktop Campinas - Internet e Internet + Celular')
          print('')
          print('| Indicador | Valor |')
          print('|---|---:|')
          print('| HTTP | %s |' % d.get('httpStatus'))
          print('| Cidade selecionada | %s |' % d.get('citySelected',False))
          print('| Disponibilidade em Campinas confirmada | %s |' % d.get('cityAvailabilityConfirmed',False))
          print('| Campinas marcada como Em breve | %s |' % d.get('campinasComingSoon',False))
          print('| Ofertas Internet | %s |' % len(d.get('fiberOffers',[])))
          print('| Ofertas Internet + Celular | %s |' % len(d.get('fiberMobileOffers',[])))
          print('| Ofertas com TV aceitas | %s |' % d.get('tvOffersAccepted',0))
          print('| Ofertas com TV rejeitadas | %s |' % d.get('tvOffersRejected',0))
          print('| Status | %s |' % d.get('status'))
          print('| Motivo | %s |' % d.get('reason','-'))
          print('')
          for o in d.get('fiberOffers',[]): print('- Fibra: %s - R$ %.2f - apos promocao %s' % (o.get('name'),o.get('monthlyPrice',0),o.get('postPromotionPrice')))
          for o in d.get('fiberMobileOffers',[]): print('- Convergente: %s - R$ %.2f - apos promocao %s' % (o.get('name'),o.get('monthlyPrice',0),o.get('postPromotionPrice')))
          PY
          else
            echo 'Resultado nao gerado.' >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash
      - name: Publicar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piloto-desktop-campinas-evidencias
          path: |
            dados/piloto-desktop-campinas.json
            evidencias-desktop-campinas/
          if-no-files-found: warn
          retention-days: 7
