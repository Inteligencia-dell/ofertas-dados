name: Piloto Desktop - Fibra e Fibra mais Movel - Lote 1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: piloto-desktop-lote-1
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validar
        run: |
          test -f scripts/coletar_desktop_lote_1.py
          python -m py_compile scripts/coletar_desktop_lote_1.py
      - name: Executar lote 1
        run: python scripts/coletar_desktop_lote_1.py
      - name: Resumo
        if: always()
        run: |
          if [ -f dados/piloto-desktop-lote-1.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('dados/piloto-desktop-lote-1.json',encoding='utf-8'));s=d.get('summary',{})
          print('### Desktop - Fibra e Fibra + Movel - Lote 1')
          print('')
          print('| Indicador | Valor |')
          print('|---|---:|')
          print('| Cidades esperadas | 20 |')
          print('| Cidades processadas | %s |' % s.get('citiesProcessed',0))
          print('| Localizacoes confirmadas | %s |' % s.get('locationsConfirmed',0))
          print('| Cidades com Fibra | %s |' % s.get('citiesWithFiber',0))
          print('| Cidades com Fibra + Movel | %s |' % s.get('citiesWithFiberMobile',0))
          print('| Ofertas com TV aceitas | %s |' % s.get('tvOffersAccepted',0))
          print('| Pendencias tecnicas | %s |' % s.get('technicalPending',0))
          print('')
          for r in d.get('results',[]):
              print('#### %s/SP' % r.get('city'))
              for o in r.get('fiberOffers',[]):print('- Fibra: %s - R$ %.2f - apos R$ %s' % (o['name'],o['monthlyPrice'],o.get('postPromotionPrice')))
              for o in r.get('fiberMobileOffers',[]):print('- Fibra + Movel: %s - R$ %.2f - apos R$ %s' % (o['name'],o['monthlyPrice'],o.get('postPromotionPrice')))
              if r.get('reason'):print('- Motivo: %s' % r['reason'])
          PY
          fi
      - name: Publicar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piloto-desktop-lote-1-evidencias
          path: |
            dados/piloto-desktop-lote-1.json
            evidencias-desktop-lote-1/
          if-no-files-found: warn
          retention-days: 7
