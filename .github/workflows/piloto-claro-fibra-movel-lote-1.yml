name: Piloto Claro - Fibra e Fibra mais Movel - Lote 1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: piloto-claro-fibra-movel-lote-1
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Playwright e Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Validar piloto
        run: |
          test -f scripts/coletar_claro_fibra_movel_lote_1.py
          python -m py_compile scripts/coletar_claro_fibra_movel_lote_1.py

      - name: Testar lote 1
        run: python scripts/coletar_claro_fibra_movel_lote_1.py

      - name: Resumo
        if: always()
        run: |
          if [ -f dados/piloto-claro-fibra-movel-lote-1.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('dados/piloto-claro-fibra-movel-lote-1.json',encoding='utf-8'))
          rs=d.get('results',[])
          print('### Claro - Fibra e Fibra + Movel - Lote 1')
          print('')
          print('| Indicador | Valor |')
          print('|---|---:|')
          print('| Cidades esperadas | 20 |')
          print('| Cidades processadas | %s |' % len(rs))
          print('| Localizacao confirmada | %s |' % sum(1 for r in rs if r.get('locationConfirmed')))
          print('| Cidades com Fibra | %s |' % sum(1 for r in rs if r.get('fiberOffers')))
          print('| Cidades com Fibra + Movel | %s |' % sum(1 for r in rs if r.get('fiberMobileOffers')))
          print('| Ofertas com TV aceitas | %s |' % sum(r.get('tvOffersAccepted',0) for r in rs))
          print('| Pendencias tecnicas | %s |' % sum(1 for r in rs if not r.get('locationConfirmed') or not r.get('fiberOffers')))
          print('')
          for r in rs:
              print('#### %s/%s' % (r.get('city'),r.get('uf')))
              print('- Localizacao confirmada: %s' % r.get('locationConfirmed',False))
              print('- Fibra: %s' % len(r.get('fiberOffers',[])))
              for o in r.get('fiberOffers',[]):
                  print('  - %s - R$ %.2f' % (o.get('name'),o.get('price',0)))
              print('- Fibra + Movel: %s' % len(r.get('fiberMobileOffers',[])))
              for o in r.get('fiberMobileOffers',[]):
                  print('  - %s - R$ %.2f - anterior %s' % (o.get('name'),o.get('monthlyPrice',0),o.get('previousPrice')))
              if r.get('reason'):
                  print('- Motivo: %s' % r.get('reason'))
          PY
          else
            echo 'Resultado nao gerado.' >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash

      - name: Publicar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piloto-claro-fibra-movel-lote-1-evidencias
          path: |
            dados/piloto-claro-fibra-movel-lote-1.json
            evidencias-claro-fibra-movel-lote-1/
          if-no-files-found: warn
          retention-days: 7
