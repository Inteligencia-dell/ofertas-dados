name: Piloto Claro por cidade

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: piloto-claro-cidade
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Playwright e Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Validar piloto
        run: |
          test -f scripts/coletar_claro_cidade_piloto.py
          python -m py_compile scripts/coletar_claro_cidade_piloto.py

      - name: Testar Campinas na Claro
        run: python scripts/coletar_claro_cidade_piloto.py

      - name: Resumo
        if: always()
        run: |
          if [ -f dados/piloto-claro-cidade.json ]; then
            python - <<'PY'
          import json
          d=json.load(open('dados/piloto-claro-cidade.json',encoding='utf-8'))
          print('### Piloto Claro - Campinas/SP')
          print('')
          print('| Indicador | Resultado |')
          print('|---|---|')
          print('| HTTP | %s |' % d.get('httpStatus','-'))
          print('| Cidade confirmada | %s |' % d.get('locationConfirmed',False))
          print('| Ofertas encontradas | %s |' % len(d.get('offersFound',[])))
          print('| Status | %s |' % d.get('status','-'))
          print('| Motivo | %s |' % d.get('reason','-'))
          PY
          else
            echo 'Resultado do piloto nao foi gerado.'
          fi
        shell: bash

      - name: Publicar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piloto-claro-cidade-evidencias
          path: |
            dados/piloto-claro-cidade.json
            evidencias-claro-cidade/
          if-no-files-found: warn
          retention-days: 7
