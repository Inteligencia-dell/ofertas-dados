name: Atualizar ofertas

# Coleta ofertas das URLs cadastradas na coluna FONTE_SITE.
# Horarios em UTC. Brasilia = UTC-3.
on:
  schedule:
    - cron: '25 9,15,21 * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Executar sem gravar, apenas validar'
        type: boolean
        default: false

      operadora:
        description: 'Limitar a uma operadora. Vazio consulta todas'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: atualizar-ofertas
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar estrutura do repositorio
        run: |
          echo "Arquivos encontrados:"
          find . -maxdepth 4 -type f | sort

          test -f scripts/coletar_ofertas.py
          test -f scripts/resumo.py
          test -f fontes.json
          test -f dados/ofertas.json
          test -f dados/status/index.json

      - name: Instalar Playwright e Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Validar sintaxe Python
        run: |
          python -m py_compile scripts/coletar_ofertas.py
          python -m py_compile scripts/resumo.py

      - name: Executar coletor
        run: |
          python scripts/coletar_ofertas.py \
            --ambiente producao \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.operadora && format('--operadora {0}', inputs.operadora) || '' }}

      - name: Resumo da execucao
        if: always()
        run: python scripts/resumo.py >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar alteracoes
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add dados/ofertas.json dados/status/index.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao de oferta nesta execucao."
            exit 0
          fi

          git commit -m "Atualizacao automatica via FONTE_SITE - $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
