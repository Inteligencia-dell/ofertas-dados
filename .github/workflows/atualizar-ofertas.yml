name: Atualizar ofertas

# Coleta as ofertas nas URLs da coluna FONTE_SITE.
# Horarios em UTC. Brasilia = UTC-3.
on:
  schedule:
    - cron: '25 9,15,21 * * *'
  workflow_dispatch:
    inpu*s:
      dry_run:
        descript*on: 'Executar sem gravar, apenas v*lidar'
        type: boolean
     *  default: false
      operadora:
*       description: 'Limitar a uma*operadora. Vazio consulta todas'
 *      type: string
        default* ''

permissions:
  contents: writ*

concurrency:
  group: atualizar-*fertas
  cancel-in-progress: false*
jobs:
  coletar:
    runs-on: ubu*tu-24.04
    timeout-minutes: 60

*   steps:
      - name: Obter repo*itorio
        uses: actions/check*ut@v6

      - name: Preparar Pyth*n
        uses: actions/setup-pyth*n@v6
        with:
          pytho*-version: '3.13'

      - name: In*talar Playwright e Chromium
      * run: |
          python -m pip in*tall --upgrade pip
          pip i*stall playwright
          python *m playwright install --with-deps c*romium

      - name: Executar col*tor
        run: |
          pytho* scripts/coletar_ofertas.py \
    *       --ambiente producao \
     *      ${{ inputs.dry_run && '--dry*run' || '' }} \
            ${{ in*uts.operadora && format('--operado*a {0}', inputs.operadora) || '' }}*
      - name: Resumo da execucao
*       if: always()
        run: p*thon scripts/resumo.py >> "$GITHUB*STEP_SUMMARY"

      - name: Publi*ar alteracoes
        if: ${{ !inp*ts.dry_run }}
        run: |
     *    git config user.name 'github-a*tions[bot]'
          git config u*er.email 'github-actions[bot]@user*.noreply.github.com'
          git*add dados/ofertas.json dados/statu*/index.json

          if git diff*--cached --quiet; then
           *echo "Nenhuma alteracao de oferta *esta execucao."
            exit 0*          fi

          git commit*-m "Atualizacao automatica via FON*E_SITE - $(date -u '+%Y-%m-%d %H:%* UTC')"
          git push
