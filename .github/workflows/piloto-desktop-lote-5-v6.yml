name: Piloto Desktop v6 - Lote 5

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: piloto-desktop-lote-5-v6
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validar coletor
        run: |
          test -f scripts/coletar_desktop_lote_5_v6.py
          python -m py_compile scripts/coletar_desktop_lote_5_v6.py
      - name: Executar lote 5
        run: python scripts/coletar_desktop_lote_5_v6.py
      - name: Resumo
        if: always()
        run: |
          if [ -f dados/piloto-desktop-lote-5-v6.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open('dados/piloto-desktop-lote-5-v6.json', encoding='utf-8'))
          s = d.get('summary', {})
          print('### Desktop v6 - Lote 5')
          print('')
          print('| Indicador | Valor |')
          print('|---|---:|')
          print('| Cidades esperadas | 3 |')
          print('| Cidades processadas | %s |' % s.get('citiesProcessed', 0))
          print('| Localizacoes confirmadas | %s |' % s.get('locationsConfirmed', 0))
          print('| Cidades com Fibra | %s |' % s.get('citiesWithFiber', 0))
          print('| Cidades com Fibra + Movel | %s |' % s.get('citiesWithFiberMobile', 0))
          print('| Ofertas com TV aceitas | %s |' % s.get('tvOffersAccepted', 0))
          print('| Pendencias territoriais | %s |' % s.get('territorialPending', 0))
          print('')
          for r in d.get('results', []):
              print('#### %s/SP' % r.get('city'))
              print('')
              print('**Fibra**')
              if r.get('fiberOffers'):
                  for o in r['fiberOffers']:
                      extra = ' + Desktop Play de cortesia' if o.get('desktopPlayCourtesy') else ''
                      print('- %s%s - R$ %.2f - apos R$ %s' % (
                          o['name'], extra, o['monthlyPrice'], o.get('postPromotionPrice')))
              else:
                  print('- nenhuma')
              print('')
              print('**Fibra + Movel**')
              if r.get('fiberMobileOffers'):
                  for o in r['fiberMobileOffers']:
                      print('- %s - R$ %.2f - apos R$ %s' % (
                          o['name'], o['monthlyPrice'], o.get('postPromotionPrice')))
              else:
                  print('- nenhuma')
              tab = r.get('tabDiagnostics') or {}
              if r.get('locationConfirmed') and not r.get('fiberMobileOffers'):
                  print('- Abas clicadas: %s | cards por aba: %s' % (
                      ', '.join(tab.get('tabsClicked') or []), tab.get('cardsPerTab')))
              if r.get('reason'):
                  print('- Motivo: %s' % r['reason'])
              print('')
          PY
          fi
      - name: Publicar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piloto-desktop-lote-5-v6-evidencias
          path: |
            dados/piloto-desktop-lote-5-v6.json
            evidencias-desktop-lote-5-v6/
          if-no-files-found: warn
          retention-days: 7
